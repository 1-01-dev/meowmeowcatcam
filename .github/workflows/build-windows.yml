name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build desktop EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name MeowMeowCatCam `
            --add-data "models;models" `
            --add-data "memes;memes" `
            desktop_stream.py

      - name: Build OBS transparent overlay EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name MeowMeowCatCam-OBS `
            --add-data "models;models" `
            --add-data "memes;memes" `
            obs_overlay.py

      - name: Upload desktop EXE
        uses: actions/upload-artifact@v5
        with:
          name: MeowMeowCatCam-Windows
          path: dist/MeowMeowCatCam.exe
          if-no-files-found: error

      - name: Upload OBS overlay EXE
        uses: actions/upload-artifact@v5
        with:
          name: MeowMeowCatCam-OBS-Windows
          path: dist/MeowMeowCatCam-OBS.exe
          if-no-files-found: error

      - name: Attach EXEs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MeowMeowCatCam.exe
            dist/MeowMeowCatCam-OBS.exe
